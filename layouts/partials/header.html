<!DOCTYPE html>
<html lang="en">
<head>

  <!-- SITE TITTLE -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>

  <!-- SEO -->
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description | default "Automated Ascent specializes in cloud-native application development, container solutions, DevSecOps, and Continuous Integration/Continuous Delivery implementations. Expert consulting, training, and technical writing services." }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description | default "Automated Ascent specializes in cloud-native application development, container solutions, DevSecOps, and Continuous Integration/Continuous Delivery implementations. Expert consulting, training, and technical writing services." }}{{ end }}">
  <meta property="og:image" content="{{ .Site.BaseURL }}images/logo.svg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="{{ .Permalink }}">
  <meta property="twitter:title" content="{{ .Title }}">
  <meta property="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description | default "Automated Ascent specializes in cloud-native application development, container solutions, DevSecOps, and Continuous Integration/Continuous Delivery implementations. Expert consulting, training, and technical writing services." }}{{ end }}">
  <meta property="twitter:image" content="{{ .Site.BaseURL }}images/logo.svg">
  
  <!-- PLUGINS CSS STYLE -->
  <!-- Bootstrap -->
  <link href="{{ "plugins/bootstrap/css/bootstrap.min.css" | absURL }}" rel="stylesheet">
  <!-- Themefisher Font -->  
  <link href="{{ "plugins/themefisher-font/style.css" | absURL }}" rel="stylesheet">
  <!-- Swiper Carousel -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- CUSTOM CSS -->
  <link href="{{ "css/style.css" | absURL }}" rel="stylesheet">

  <!-- FAVICON -->
  <link href="{{ "images/favicon.ico" | absURL }}" rel="shortcut icon">
  
  {{ if ne (printf "%v" $.Site.BaseURL) "http://localhost:1313/" }}
    {{ template "_internal/google_analytics.html" . }}
  {{ end }}

</head>

<body class="body-wrapper">
