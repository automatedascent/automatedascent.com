<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#6b46ff;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Geometric shapes suggesting upward movement (ascent) -->
  <g opacity="0.3">
    <!-- Ascending triangles -->
    <polygon points="100,500 150,400 200,500" fill="url(#grad1)">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="translate"
        from="0 0"
        to="0 -20"
        dur="3s"
        repeatCount="indefinite"
        values="0 0; 0 -20; 0 0"
      />
    </polygon>

    <polygon points="800,600 850,500 900,600" fill="url(#grad1)">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="translate"
        from="0 0"
        to="0 -15"
        dur="4s"
        repeatCount="indefinite"
        values="0 0; 0 -15; 0 0"
      />
    </polygon>

    <!-- Circles suggesting automation/gears -->
    <circle cx="1200" cy="300" r="30" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.2">
      <animate attributeName="r" from="30" to="35" dur="2s" repeatCount="indefinite" values="30; 35; 30"/>
    </circle>

    <circle cx="300" cy="200" r="20" fill="none" stroke="#2e7eed" stroke-width="2" opacity="0.2">
      <animate attributeName="r" from="20" to="25" dur="3s" repeatCount="indefinite" values="20; 25; 20"/>
    </circle>

    <!-- Ascending arrows/chevrons -->
    <path d="M 600 400 L 650 350 L 700 400" stroke="#00d4ff" stroke-width="3" fill="none" opacity="0.15">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="translate"
        from="0 0"
        to="0 -30"
        dur="2.5s"
        repeatCount="indefinite"
        values="0 0; 0 -30; 0 0"
      />
    </path>

    <!-- Hexagons (tech theme) -->
    <polygon points="1000,150 1020,165 1020,195 1000,210 980,195 980,165"
             fill="none" stroke="#6b46ff" stroke-width="2" opacity="0.2">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="0 1000 180"
        to="360 1000 180"
        dur="20s"
        repeatCount="indefinite"
      />
    </polygon>
  </g>
</svg>